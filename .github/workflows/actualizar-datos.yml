name: Actualizar datos desde GeoGestión

on:
  schedule:
    # Todos los días a las 6:00 de Tucumán (9:00 UTC)
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar intervenciones
        env:
          GEOGESTION_CUIL: ${{ secrets.GEOGESTION_CUIL }}
          GEOGESTION_PASSWORD: ${{ secrets.GEOGESTION_PASSWORD }}
        run: python scripts/descargar_geogestion.py

      - name: Guardar cambios
        run: |
          git add data/intervenciones.csv data/actualizacion.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Datos actualizados desde GeoGestión ($(date -u +%Y-%m-%d))"
          git push
